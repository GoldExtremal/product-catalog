server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # image_url приходит как /img/<id>.jpg, поэтому проксируем и /img.
  location /api/ {
    proxy_pass http://mock-api:4000;
    proxy_set_header Host $host;
  }

  location /img/ {
    proxy_pass http://mock-api:4000;
    proxy_set_header Host $host;
  }

  # Имена в /assets содержат хеш содержимого — их можно кэшировать навсегда.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html всегда перепроверяется, иначе пользователь застрянет на старом бандле.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
